# Zhiwo is a thin overlay on the shipped dsh web profile. The native Host,
# Agent Loop, session persistence, API implementation, and browser runtime
# remain native; this layer selects one workspace, one Agent composition, a
# browser Session access policy, and a smaller set of browser occupants.

- id: tools
  config:
    mode: native

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.env.ZHIWO_WORKSPACE_ROOT ?? 'userdata'

- id: approval
  config:
    policy: never

- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: never
        name: read-only
        description: Read the workspace without mutation or approval prompts.
    defaultPreset: read-only

# An explicit CLI flag remains the one-invocation override. Zhiwo's deployment
# default is stable and its environment override never asks the OS for a
# random port; the Web Server rejects invalid or occupied values at load/bind.
- id: webserver
  config:
    host: !!js ctx.webStartup.host ?? '127.0.0.1'
    port: !!js ctx.webStartup.port ?? Number(process.env.ZHIWO_LISTEN_PORT ?? '18000')

- id: agent-presets
  config:
    default: zhiwo
    includeUserRoot: false

# Keep the settings domain service because conversation preferences consume it,
# but remove its visible shell and every generic configuration page.
- id: ui-settings-general
  disabled: true

- id: ui-settings-models
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: ui-settings-plugins
  disabled: true

- id: ui-brand-official
  disabled: true

- id: session-log-download
  disabled: true

# Local spill locators are physical Host paths. Zhiwo keeps bounded inline
# previews and asks the Agent to narrow a search instead of exposing them.
- id: spill-local
  disabled: true

- id: ui-workspace
  disabled: true

- id: ui-attachment
  disabled: true

- id: ui-cordis
  disabled: true

- id: ui-workflow-run
  disabled: true

- id: ui-deliverables
  disabled: true

- id: ui-skill
  disabled: true

- id: ui-subagent
  disabled: true

- id: ui-reference
  disabled: true

- id: ui-jobs
  disabled: true

- id: ui-goal
  disabled: true

- id: ui-permission
  disabled: true

- id: ui-agent-preset
  disabled: true

- id: ui-plan
  disabled: true

- id: ui-user-questions
  disabled: true

- id: ui-trajectory
  disabled: true

- insert:
    - id: zhiwo-product
      name: '@deepseek-ai/dsh-zhiwo-product'
      config:
        workspaceRoot: !!js process.env.ZHIWO_WORKSPACE_ROOT ?? 'userdata'

    - id: ui-zhiwo
      name: '@deepseek-ai/dsh-zhiwo-ui'
